<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AETERNA">
  <title>AETERNA | Digital Synthesis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200">
  <div id="root"></div>
  <script type="text/babel">
    const {useState}=React;
    const STORAGE_KEY='aeterna_gemini_api_key';
    const MODEL_NAME='gemini-2.5-flash';
    function App(){
      const [loading,setLoading]=useState(false),[result,setResult]=useState(''),[mediaFile,setMediaFile]=useState(null),[mediaBase64,setMediaBase64]=useState(''),[preview,setPreview]=useState(''),[status,setStatus]=useState('Listo.'),[hasKey,setHasKey]=useState(!!localStorage.getItem(STORAGE_KEY));
      const handleFileChange=e=>{const file=e.target.files[0]; if(!file)return; setMediaFile(file); setStatus('Preparando archivo...'); if(preview) URL.revokeObjectURL(preview); setPreview(URL.createObjectURL(file)); const r=new FileReader(); r.onload=ev=>{setMediaBase64(String(ev.target.result).split(',')[1]); setStatus('Archivo cargado.')}; r.onerror=()=>setStatus('Error al leer el archivo.'); r.readAsDataURL(file)};
      const getApiKey=()=>{let key=localStorage.getItem(STORAGE_KEY)||''; if(!key){key=(prompt('Pega tu Gemini API Key para continuar:','')||'').trim(); if(key){localStorage.setItem(STORAGE_KEY,key); setHasKey(true)}} return key};
      const manageKey=()=>{const cur=localStorage.getItem(STORAGE_KEY)||''; const val=prompt('Configura tu Gemini API Key. Deja vacío para cancelar o borrar si ya había una.',cur); if(val===null)return; const clean=val.trim(); if(!clean){if(cur&&confirm('¿Borrar la API Key guardada?')){localStorage.removeItem(STORAGE_KEY); setHasKey(false); setStatus('API Key borrada.')}} else {localStorage.setItem(STORAGE_KEY,clean); setHasKey(true); setStatus('API Key guardada en este dispositivo.')}};
      const handleTranscribe=async()=>{if(!mediaFile||!mediaBase64){setStatus('Selecciona un archivo antes de iniciar la conversión.'); return} const apiKey=getApiKey(); if(!apiKey){setStatus('Falta la API Key.'); return} setLoading(true); setResult(''); setStatus('Sintetizando...'); try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Transcribe el archivo adjunto. Solo devuelve el texto literal, sin frases introductorias.'},{inlineData:{mimeType:mediaFile.type||'application/octet-stream',data:mediaBase64}}]}]})}); const data=await res.json(); if(!res.ok) throw new Error(data?.error?.message||`Error HTTP ${res.status}`); const raw=(data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n'); const txt=raw.replace(/^(Claro,|Aquí tienes|Aqui tienes|La transcripción|La transcripcion|Hola|¡Hola!|Aquí está|Aqui está|Te dejo la|Transcripción:|Transcripcion:).*\n?/i,'').trim(); setResult(txt||'No se ha recibido texto.'); setStatus('Conversión completada.')}catch(e){setResult('Error: '+(e.message||'No se pudo procesar el archivo.')); setStatus('Error al procesar el archivo.')}finally{setLoading(false)}};
      const copy=async()=>{if(result){await navigator.clipboard.writeText(result); setStatus('Texto copiado.')}};
      const download=()=>{if(!result)return; const b=new Blob([result],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='transcripcion.txt'; a.click(); URL.revokeObjectURL(a.href)};
      return <div className="min-h-screen p-4 flex items-center justify-center"><div className="max-w-md w-full bg-[#0d1521] border border-slate-800 rounded-3xl p-6 shadow-2xl"><h1 className="text-4xl font-light text-white text-center mb-1 tracking-[0.2em] uppercase">AETERNA</h1><p className="text-[10px] text-slate-500 text-center mb-8 tracking-[0.4em] uppercase">Digital Synthesis</p><div className="flex flex-col gap-4 mb-8"><p className="text-[10px] text-cyan-400 font-bold uppercase tracking-widest text-center border-b border-slate-800 pb-2">Paso 1: Obtén el archivo</p><a href="https://snaptik.app/" target="_blank" rel="noreferrer" className="w-full bg-[#00a86b] hover:bg-[#008f5a] text-white font-bold py-3.5 rounded-xl text-center text-sm transition-all">TikTok Downloader</a><a href="https://www.y2mate.is/" target="_blank" rel="noreferrer" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl text-center text-sm transition-all">YouTube Downloader</a></div><div className="bg-slate-950 p-5 rounded-2xl border border-slate-700 text-center mb-6"><p className="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-4">Paso 2: Selección</p><input type="file" accept="video/*,audio/*" onChange={handleFileChange} className="block w-full text-sm text-slate-300 file:mr-4 file:py-2.5 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950"/><p className="mt-4 text-xs text-slate-500 break-words">{mediaFile?mediaFile.name:'Ningún archivo seleccionado'}</p></div>{preview&&((mediaFile?.type||'').startsWith('audio/')?<audio src={preview} controls className="w-full mb-6 rounded-2xl"/>:<video src={preview} controls className="w-full mb-6 rounded-2xl"/>)}<button onClick={handleTranscribe} disabled={loading} className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl mb-4 disabled:opacity-60">{loading?'Sintetizando...':'Iniciar Conversión'}</button><div className="mb-8 flex items-center justify-between gap-4"><p className="text-xs text-slate-500">{status}</p><button onClick={manageKey} type="button" className="text-[10px] uppercase tracking-widest text-cyan-400 hover:text-cyan-300 whitespace-nowrap">{hasKey?'Gestionar API Key':'Configurar API Key'}</button></div>{result&&<div className="space-y-4"><div className="bg-slate-950 p-5 rounded-2xl border border-slate-700 text-sm max-h-60 overflow-y-auto whitespace-pre-wrap">{result}</div><div className="grid grid-cols-2 gap-3"><button onClick={copy} className="bg-slate-800 py-3 rounded-xl text-xs font-bold">Copiar</button><button onClick={download} className="bg-slate-800 py-3 rounded-xl text-xs font-bold">Descargar</button></div></div>}<p className="mt-10 text-[9px] text-slate-600 uppercase text-center tracking-widest">Architected by GUSLIGHT</p></div></div>
    }
    if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
