<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETERNA | Digital Synthesis</title>
    <meta name="theme-color" content="#020617">
    <meta name="description" content="Transcribe vídeos y publicaciones con imágenes para compartir o guardar.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const BACKEND_URL = ["localhost", "127.0.0.1"].includes(location.hostname)
            ? "http://127.0.0.1:3000"
            : "https://aeterna-pro-backend.onrender.com";

        const GithubIcon = () => <svg viewBox="0 0 16 16" aria-hidden="true" className="h-5 w-5 fill-current shrink-0"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.85-2.69-1.3-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.73c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>;

        function App() {
            const [loading, setLoading] = useState(false);
            const [saving, setSaving] = useState(false);
            const [result, setResult] = useState(null);
            const [resultMeta, setResultMeta] = useState(null);
            const [guide, setGuide] = useState('');
            const [guideType, setGuideType] = useState('procedure');
            const [guideView, setGuideView] = useState(false);
            const [guideLoading, setGuideLoading] = useState(false);
            const [guideError, setGuideError] = useState('');
            const contentRef = useRef(null);
            const [activeMode, setActiveMode] = useState('audio');
            const [visualVerification, setVisualVerification] = useState(false);
            const [sourceUrl, setSourceUrl] = useState("");
            const [errorMsg, setErrorMsg] = useState(null);
            const [saveMsg, setSaveMsg] = useState(null);
            const [urlProgress, setUrlProgress] = useState(0);
            const [urlTranscribing, setUrlTranscribing] = useState(false);
            const [progressEstimateMs, setProgressEstimateMs] = useState(25000);
            const [title, setTitle] = useState("");
            const [platform, setPlatform] = useState("TikTok");
            const [geminiSession, setGeminiSession] = useState(() => localStorage.getItem('aeterna-gemini-session') || '');
            const [geminiConnected, setGeminiConnected] = useState(false);
            const [geminiChecking, setGeminiChecking] = useState(() => !!localStorage.getItem('aeterna-gemini-session'));
            const [geminiOpen, setGeminiOpen] = useState(false);
            const [geminiApiKey, setGeminiApiKey] = useState('');
            const [geminiBusy, setGeminiBusy] = useState(false);
            const [geminiError, setGeminiError] = useState('');
            const [githubSession, setGithubSession] = useState(() => localStorage.getItem('aeterna-github-session') || '');
            const [githubConnected, setGithubConnected] = useState(false);
            const [githubChecking, setGithubChecking] = useState(() => !!localStorage.getItem('aeterna-github-session') || location.hash.includes('github_session='));
            const [githubLogin, setGithubLogin] = useState('');
            const ownerGeminiReady = githubConnected && githubLogin.toLowerCase() === 'gusl1ght';
            const canTranscribe = geminiConnected || ownerGeminiReady;
            const [githubConfigured, setGithubConfigured] = useState(false);
            const [githubRepositories, setGithubRepositories] = useState([]);
            const [githubRepository, setGithubRepository] = useState(() => localStorage.getItem('aeterna-github-repository') || '');
            const [saveOnTranscribe, setSaveOnTranscribe] = useState(false);
            const [githubInstallUrl, setGithubInstallUrl] = useState('');
            const [repositoryLoading, setRepositoryLoading] = useState(false);
            const [installPrompt, setInstallPrompt] = useState(null);

            useEffect(() => {
                if (contentRef.current) contentRef.current.scrollTop = 0;
            }, [guideView, guide, result]);

            useEffect(() => {
                if (!geminiSession) { setGeminiChecking(false); return; }
                let active = true;
                setGeminiChecking(true);
                fetch(`${BACKEND_URL}/api/gemini-auth/status`, { headers: { 'X-Aeterna-Gemini-Session': geminiSession } })
                    .then(async response => ({ ok: response.ok, status: response.status, data: await response.json() }))
                    .then(({ ok, status, data }) => {
                        if (!active) return;
                        if (!ok && status !== 401) throw new Error('Estado temporalmente no disponible');
                        setGeminiConnected(!!data.connected);
                        if (!data.connected) {
                            localStorage.removeItem('aeterna-gemini-session');
                            setGeminiSession('');
                        }
                        setGeminiChecking(false);
                    })
                    .catch(() => { if (active) { setGeminiError('No se puede comprobar la conexión con Gemini.'); setGeminiChecking(false); } });
                return () => { active = false; };
            }, [geminiSession]);

            const connectGemini = async (event) => {
                event.preventDefault();
                setGeminiBusy(true);
                setGeminiError('');
                try {
                    const response = await fetch(`${BACKEND_URL}/api/gemini-auth/connect`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ apiKey: geminiApiKey.trim() })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.connected) throw new Error(data.error || 'No se pudo conectar Gemini.');
                    localStorage.setItem('aeterna-gemini-session', data.sessionId);
                    setGeminiSession(data.sessionId);
                    setGeminiConnected(true);
                    setGeminiOpen(false);
                } catch (error) {
                    setGeminiError(error.message || 'No se pudo conectar Gemini.');
                } finally {
                    setGeminiApiKey('');
                    setGeminiBusy(false);
                }
            };

            const disconnectGemini = async () => {
                try { await fetch(`${BACKEND_URL}/api/gemini-auth/logout`, { method: 'POST', headers: { 'X-Aeterna-Gemini-Session': geminiSession } }); } catch (_) {}
                localStorage.removeItem('aeterna-gemini-session');
                setGeminiSession('');
                setGeminiConnected(false);
                setGeminiError('');
            };

            useEffect(() => {
                const onInstallPrompt = (event) => { event.preventDefault(); setInstallPrompt(event); };
                const onInstalled = () => setInstallPrompt(null);
                window.addEventListener('beforeinstallprompt', onInstallPrompt);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onInstallPrompt);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            const installApp = async () => {
                if (!installPrompt) return;
                await installPrompt.prompt();
                await installPrompt.userChoice;
                setInstallPrompt(null);
            };

            const adoptGithubSession = (response, previous) => {
                const renewed = response.headers.get('X-Aeterna-Github-Session');
                if (renewed) {
                    localStorage.setItem('aeterna-github-session', renewed);
                    setGithubSession(renewed);
                }
                return renewed || previous;
            };

            const loadRepositories = async (session) => {
                setRepositoryLoading(true);
                try {
                    const response = await fetch(`${BACKEND_URL}/api/github-auth/repositories`, { headers: { Authorization: `Bearer ${session}` } });
                    adoptGithubSession(response, session);
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'No se pudieron cargar los repositorios.');
                    const list = data.repositories || [];
                    setGithubRepositories(list);
                    setGithubInstallUrl(data.installUrl || '');
                    setGithubRepository(current => {
                        const selected = list.some(repo => repo.fullName === current) ? current : (list.length === 1 ? list[0].fullName : '');
                        if (selected) localStorage.setItem('aeterna-github-repository', selected);
                        else localStorage.removeItem('aeterna-github-repository');
                        return selected;
                    });
                } catch (error) {
                    setErrorMsg(error.message);
                } finally {
                    setRepositoryLoading(false);
                }
            };

            useEffect(() => {
                const loadGithub = async () => {
                    let session = localStorage.getItem('aeterna-github-session') || sessionStorage.getItem('aeterna-github-session') || '';
                    const hash = new URLSearchParams(location.hash.slice(1));
                    if (hash.has('github_session')) {
                        session = hash.get('github_session') || '';
                        localStorage.setItem('aeterna-github-session', session);
                        sessionStorage.removeItem('aeterna-github-session');
                        setGithubSession(session);
                        history.replaceState(null, '', location.pathname + location.search);
                    }
                    try {
                        const configResponse = await fetch(`${BACKEND_URL}/api/github-auth/config`);
                        const config = await configResponse.json();
                        setGithubConfigured(!!config.configured);
                        setGithubInstallUrl(config.installUrl || '');
                        if (session && config.configured) {
                            const response = await fetch(`${BACKEND_URL}/api/github-auth/status`, { headers: { Authorization: `Bearer ${session}` } });
                            session = adoptGithubSession(response, session);
                            const data = await response.json();
                            if (response.ok && data.connected) {
                                localStorage.setItem('aeterna-github-session', session);
                                sessionStorage.removeItem('aeterna-github-session');
                                setGithubConnected(true);
                                setGithubLogin(data.login || '');
                                await loadRepositories(session);
                            } else if (response.status === 401) {
                                localStorage.removeItem('aeterna-github-session');
                                sessionStorage.removeItem('aeterna-github-session');
                                setGithubSession('');
                            }
                        }
                    } catch (_) {}
                    finally { setGithubChecking(false); }
                };
                loadGithub();
            }, []);

            const disconnectGithub = async () => {
                if (githubSession) {
                    try { await fetch(`${BACKEND_URL}/api/github-auth/logout`, { method: 'POST', headers: { Authorization: `Bearer ${githubSession}` } }); } catch (_) {}
                }
                localStorage.removeItem('aeterna-github-session');
                localStorage.removeItem('aeterna-github-repository');
                sessionStorage.removeItem('aeterna-github-session');
                setGithubSession('');
                setGithubConnected(false);
                setGithubLogin('');
                setGithubRepositories([]);
                setGithubRepository('');
            };

            useEffect(() => {
                if (!urlTranscribing) return;
                const startedAt = Date.now();
                const timer = window.setInterval(() => {
                    const elapsedMs = Date.now() - startedAt;
                    const fraction = 1 - Math.exp(-3 * elapsedMs / progressEstimateMs);
                    setUrlProgress(Math.min(95, Math.round(5 + 90 * fraction)));
                }, 500);
                return () => window.clearInterval(timer);
            }, [urlTranscribing, progressEstimateMs]);

            const progressKeyForUrl = (url) => {
                const host = new URL(url).hostname.toLowerCase();
                const platform = host.includes('youtube.com') || host === 'youtu.be' ? 'youtube'
                    : host.includes('tiktok.com') ? 'tiktok' : 'other';
                return `aeterna-transcription-times-${platform}`;
            };

            const previousDurations = (key) => {
                try {
                    const durations = JSON.parse(localStorage.getItem(key) || '[]');
                    return Array.isArray(durations) ? durations.filter(value => Number.isFinite(value) && value >= 1000 && value <= 300000).slice(-5) : [];
                } catch (_) {
                    return [];
                }
            };

            const resetOutput = () => {
                setErrorMsg(null);
                setSaveMsg(null);
                setResult(null);
                setResultMeta(null);
                setGuide('');
                setGuideType('procedure');
                setGuideView(false);
                setGuideError('');
                setVisualVerification(false);
            };

            const applyTranscriptionResult = (responseData, fallbackFileName = "") => {
                setResult(responseData.transcription);
                setVisualVerification(!!responseData.visualVerification);
                setTitle(responseData.suggestedTitle || "");
                setPlatform(responseData.platform || platform || "URL");
                setResultMeta({
                    model: responseData.model || "",
                    fileName: responseData.fileName || fallbackFileName || "",
                    sourceUrl: responseData.sourceUrl || sourceUrl || "",
                    platform: responseData.platform || "",
                    mode: responseData.mode || 'audio'
                });
            };

            const saveTranscriptToGitHub = async (transcription, meta = {}) => {
                const response = await fetch(`${BACKEND_URL}/api/save-transcript-to-github`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: `Bearer ${githubSession}`, 'X-Aeterna-Gemini-Session': geminiSession, 'X-Aeterna-Github-Session': githubSession },
                    body: JSON.stringify({
                        title: meta.title ?? title,
                        repository: githubRepository,
                        platform: meta.platform ?? platform,
                        project: '',
                        transcription,
                        model: meta.model || resultMeta?.model || "",
                        fileName: meta.fileName || resultMeta?.fileName || "",
                        sourceUrl: meta.sourceUrl || resultMeta?.sourceUrl || sourceUrl || ""
                    })
                });
                adoptGithubSession(response, githubSession);
                const data = await response.json();
                if (!response.ok || !data.success) {
                    if (response.status === 401 && /GitHub/i.test(data.error || '')) await disconnectGithub();
                    throw new Error(data.error || `Error del servidor (${response.status})`);
                }
                setSaveMsg(`Guardado en ${data.repository}: ${data.path}`);
                return data;
            };

            const handleUrlTranscribe = async (autoSave = false, mode = 'audio') => {
                const url = sourceUrl.trim();
                if (!url) {
                    setErrorMsg("Pega un enlace de YouTube, TikTok u otra plataforma compatible.");
                    return;
                }

                const startedAt = Date.now();
                let progressKey;
                try { progressKey = progressKeyForUrl(url); } catch (_) { progressKey = 'aeterna-transcription-times-other'; }
                const durations = previousDurations(progressKey);
                const defaultEstimate = progressKey.endsWith('-youtube') ? 18000 : progressKey.endsWith('-tiktok') ? 25000 : 35000;
                const estimate = durations.length ? durations.reduce((sum, value) => sum + value, 0) / durations.length : defaultEstimate;

                setLoading(true);
                setSaving(autoSave);
                setActiveMode(mode);
                resetOutput();
                setUrlProgress(5);
                setProgressEstimateMs(estimate);
                setUrlTranscribing(true);

                try {
                    const response = await fetch(`${BACKEND_URL}/api/transcribe-url`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", 'X-Aeterna-Gemini-Session': geminiSession, 'X-Aeterna-Github-Session': githubSession },
                        body: JSON.stringify({ url, mode })
                    });
                    adoptGithubSession(response, githubSession);
                    const data = await response.json();
                    if (!response.ok || !data.success) {
                        throw new Error(data.error || `Error del servidor (${response.status})`);
                    }

                    applyTranscriptionResult(data, data.fileName || url);
                    setUrlProgress(100);
                    setSourceUrl("");
                    try {
                        localStorage.setItem(progressKey, JSON.stringify([...durations, Date.now() - startedAt].slice(-5)));
                    } catch (_) {}

                    if (autoSave) {
                        await saveTranscriptToGitHub(data.transcription, {
                            title: data.suggestedTitle || "",
                            platform: data.platform || "URL",
                            model: data.model || "",
                            fileName: data.fileName || "URL remota",
                            sourceUrl: data.sourceUrl || url
                        });
                    }
                } catch (error) {
                    const networkError = error instanceof TypeError || /NetworkError|Failed to fetch/i.test(error.message || '');
                    setErrorMsg(networkError
                        ? (['localhost', '127.0.0.1'].includes(location.hostname)
                            ? 'No se puede conectar con la API local. Abre la aplicación con tools/run-dev.ps1 y comprueba que muestre «API OK / UI OK».'
                            : 'No se puede conectar con el servidor. Espera un momento y vuelve a intentarlo.')
                        : error.message || "No se ha podido transcribir este contenido.");
                } finally {
                    setUrlTranscribing(false);
                    setLoading(false);
                    setSaving(false);
                }
            };

            const createGuide = async () => {
                if (!result || guideLoading) return;
                setGuideLoading(true);
                setGuideError('');
                try {
                    const response = await fetch(`${BACKEND_URL}/api/create-guide`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Aeterna-Gemini-Session': geminiSession, 'X-Aeterna-Github-Session': githubSession },
                        body: JSON.stringify({ transcription: result, title, sourceUrl: resultMeta?.sourceUrl || '', mode: resultMeta?.mode || 'audio' })
                    });
                    adoptGithubSession(response, githubSession);
                    const data = await response.json();
                    if (!response.ok || !data.success) throw new Error(response.status === 401 ? 'Vuelve a conectar Gemini para crear la guía.' : data.error || 'No se pudo crear la guía.');
                    setGuide(data.guide);
                    setGuideType(data.type || 'procedure');
                    setGuideView(true);
                } catch (error) {
                    setGuideError(error.message || 'No se pudo crear la guía.');
                } finally {
                    setGuideLoading(false);
                }
            };

            const shareTranscript = async () => {
                const visibleText = guideView && guide ? guide : result;
                if (!visibleText) return;
                if (navigator.share) {
                    try {
                        await navigator.share({ title: guideView ? (guideType === 'catalogue' ? 'Programas del vídeo' : 'Guía AETERNA') : title || 'Transcripción AETERNA', text: visibleText });
                        return;
                    } catch (error) {
                        if (error?.name === 'AbortError') return;
                    }
                }
                try {
                    await navigator.clipboard.writeText(visibleText);
                    alert('Texto copiado. Ya puedes pegarlo donde quieras compartirlo.');
                } catch (_) {
                    setErrorMsg('No se pudo compartir. Usa «Descargar archivo» para guardar la transcripción.');
                }
            };

            const downloadTextFile = () => {
                const visibleText = guideView && guide ? guide : result;
                if (!visibleText) return;
                const blob = new Blob([visibleText], { type: "text/plain" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = guideView ? (guideType === 'catalogue' ? 'programas-del-video.txt' : 'guia-paso-a-paso.txt') : 'transcripcion.txt';
                a.click();
                URL.revokeObjectURL(url);
            };

            const renderGuideText = (text) => text.split(/(https:\/\/[^\s]+)/g).map((part, index, pieces) => {
                if (!/^https:\/\//.test(part)) return part;
                const line = (pieces[index - 1] || '').split('\n').pop();
                const label = /Vídeo original:/i.test(line) ? 'Ver vídeo original' : /descarg|instala/i.test(line) ? 'Abrir página de descarga' : 'Abrir recurso';
                return <a key={index} href={part} title={part} aria-label={`${label}: ${part}`} target="_blank" rel="noopener noreferrer" className="inline-flex max-w-full rounded-md bg-cyan-900/50 px-2 py-0.5 font-semibold text-cyan-200 underline underline-offset-2 hover:bg-cyan-800/70">{label} ↗</a>;
            });

            const hasOutput = !!result || !!errorMsg || !!saveMsg;

            return (
                <div className="h-dvh w-full overflow-hidden bg-slate-950 font-sans p-2 md:p-3">
                    <div className="h-full min-h-0 max-w-6xl mx-auto bg-[#0d1521] border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
                        <header className="shrink-0 px-3 py-2 md:px-4 md:py-3 border-b border-slate-800 text-center">
                            <h1 className="text-2xl md:text-4xl font-light text-white tracking-[0.24em] uppercase leading-none">AETERNA</h1>
                            <p className="text-[8px] md:text-[9px] text-slate-500 tracking-[0.35em] uppercase mt-1">Digital Synthesis</p>
                            <p className="text-[11px] sm:text-xs leading-snug text-slate-400 mt-2">Transcribe vídeos y publicaciones con imágenes para compartir o guardar.</p>
                        </header>

                        <main className="flex-1 min-h-0 overflow-hidden grid grid-cols-1 lg:grid-cols-[390px_minmax(0,1fr)] grid-rows-[minmax(0,1fr)] gap-0">
                            <section className={`${hasOutput ? 'hidden lg:flex' : 'flex'} min-h-0 overflow-y-auto lg:border-r border-slate-800 p-2 md:p-4 flex-col gap-3`}>
                                <div className="bg-slate-950/70 p-3 rounded-2xl border border-cyan-900/60 text-center shrink-0">
                                    <div className="mb-3 text-sm">
                                        {geminiConnected || ownerGeminiReady ? null : geminiChecking || githubChecking ? (
                                            <p className="rounded-xl border border-slate-700 bg-slate-900 p-3 text-xs text-slate-300" role="status">Recuperando conexiones…</p>
                                        ) : geminiOpen ? (
                                            <form onSubmit={connectGemini} className="rounded-xl border border-violet-700 bg-slate-900 p-3 text-left space-y-2">
                                                <div className="font-semibold text-violet-200">Conectar Gemini</div>
                                                <p className="text-xs text-slate-300">Usa tu propia clave para transcribir. <a href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener noreferrer" className="text-cyan-300 underline">Crear clave gratis</a></p>
                                                <input type="password" value={geminiApiKey} onChange={(e) => setGeminiApiKey(e.target.value)} autoComplete="off" aria-label="Clave de Gemini" placeholder="Pega aquí tu clave" className="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-white" />
                                                <div className="flex gap-2"><button type="submit" disabled={geminiBusy || !geminiApiKey.trim()} className="rounded-lg bg-violet-700 px-4 py-2 font-semibold text-white disabled:opacity-50">{geminiBusy ? 'Conectando…' : 'Conectar'}</button><button type="button" onClick={() => { setGeminiOpen(false); setGeminiApiKey(''); setGeminiError(''); }} className="px-3 text-slate-300">Cancelar</button></div>
                                            </form>
                                        ) : <div className="rounded-xl border border-violet-600 bg-violet-950/40 p-3 text-left">
                                            <p className="mb-3 text-sm text-violet-100">Para empezar a transcribir, conecta primero tu clave de Google Gemini.</p>
                                            <button onClick={() => setGeminiOpen(true)} className="w-full rounded-lg bg-violet-700 px-3 py-2.5 font-semibold text-white hover:bg-violet-600">✦ Conectar Gemini</button>
                                        </div>}
                                        {geminiError && <p className="mt-1 text-xs text-red-300" role="alert">{geminiError}</p>}
                                    </div>
                                    <input type="url" value={sourceUrl} onChange={(e) => setSourceUrl(e.target.value)} disabled={loading} aria-label="Enlace de YouTube o TikTok" placeholder="Pega un enlace de YouTube o TikTok" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-sm text-slate-100 placeholder-slate-500 text-left mb-3 disabled:opacity-70" />
                                    {urlTranscribing ? (
                                        <div className="rounded-xl border border-cyan-900/60 bg-slate-900/60 p-3 text-left" aria-live="polite">
                                            <div className="flex justify-between gap-3 text-xs text-cyan-300 mb-2">
                                                <span>{activeMode === 'visual' ? 'Leyendo imágenes' : saving ? 'Transcribiendo y guardando' : 'Transcribiendo'} · progreso estimado</span>
                                                <span>{urlProgress}%</span>
                                            </div>
                                            <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden" role="progressbar" aria-label="Progreso estimado de la transcripción" aria-valuemin="0" aria-valuemax="100" aria-valuenow={urlProgress}>
                                                <div className="bg-cyan-500 h-2 transition-all duration-500" style={{ width: `${urlProgress}%` }}></div>
                                            </div>
                                            <p className="text-[10px] text-slate-400 mt-2">Estimación basada en transcripciones anteriores. El servidor no informa del avance exacto.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 gap-2">
                                            <button onClick={() => handleUrlTranscribe(!!(githubConnected && githubRepository && saveOnTranscribe))} disabled={loading || !sourceUrl.trim() || !canTranscribe} className="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition-all disabled:opacity-50">{saveOnTranscribe && githubConnected && githubRepository ? 'Transcribir y guardar' : 'Transcribir vídeo'}</button>
                                        </div>
                                    )}
                                </div>
                                <div className={githubConnected ? "rounded-xl border border-slate-800 bg-slate-950/50 p-3 text-xs shrink-0" : "flex flex-col items-center gap-1 text-xs shrink-0"}>
                                    {githubConnected ? (
                                        <div className="flex items-center justify-between gap-2"><span className="flex items-center gap-2 text-emerald-300 truncate"><GithubIcon /> GitHub conectado: {githubLogin}</span><button onClick={disconnectGithub} className="text-slate-400 hover:text-white shrink-0">Desconectar</button></div>
                                    ) : githubChecking ? (
                                        <span className="text-slate-400" role="status">Recuperando GitHub…</span>
                                    ) : githubConfigured ? (
                                        <button onClick={() => { location.href = `${BACKEND_URL}/api/github-auth/start`; }} className="inline-flex max-w-full items-center justify-center gap-2 rounded-xl border border-slate-600 bg-slate-800 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 transition-colors"><GithubIcon /> Conectar GitHub</button>
                                    ) : <span className="text-slate-400">Guardado en GitHub no disponible</span>}
                                    {githubConnected && <div className="mt-3 text-left space-y-2">
                                        <label htmlFor="github-repository" className="block text-slate-300 font-semibold">Guardar en</label>
                                        <select id="github-repository" value={githubRepository} onChange={(e) => { setGithubRepository(e.target.value); if (e.target.value) localStorage.setItem('aeterna-github-repository', e.target.value); else localStorage.removeItem('aeterna-github-repository'); }} disabled={repositoryLoading} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100">
                                            <option value="">{repositoryLoading ? 'Cargando repositorios...' : 'Selecciona un repositorio'}</option>
                                            {githubRepositories.map(repo => <option key={repo.fullName} value={repo.fullName}>{repo.fullName}{repo.private ? ' · privado' : ''}</option>)}
                                        </select>
                                        {githubRepository && <label className="flex items-center gap-2 text-slate-300"><input type="checkbox" checked={saveOnTranscribe} onChange={(e) => setSaveOnTranscribe(e.target.checked)} className="accent-emerald-500" />Guardar esta transcripción en GitHub</label>}
                                        <div className="flex justify-between gap-2 text-cyan-300">
                                            {githubInstallUrl && <a href={githubInstallUrl} target="_blank" rel="noopener noreferrer" className="hover:underline">Añadir repositorio</a>}
                                            <button onClick={() => loadRepositories(githubSession)} disabled={repositoryLoading} className="hover:underline disabled:opacity-50">Actualizar lista</button>
                                        </div>
                                    </div>}
                                    {(geminiConnected || ownerGeminiReady) && <div className="flex items-center justify-end gap-2 text-[11px] text-emerald-300" aria-label="Gemini conectado"><span>✦ Gemini conectado</span>{geminiConnected && <button onClick={disconnectGemini} className="text-slate-400 underline hover:text-white">Desconectar</button>}</div>}
                                </div>
                            </section>

                            <section className={`${hasOutput ? 'flex' : 'hidden lg:flex'} min-h-0 overflow-hidden p-2 md:p-4 flex-col gap-2 md:gap-3`}>
                                {hasOutput && <button onClick={resetOutput} className="lg:hidden self-start inline-flex items-center rounded-xl border border-cyan-700 bg-slate-800 px-4 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-slate-700 active:bg-slate-600">← {result ? 'Transcribir otro vídeo' : 'Volver y reintentar'}</button>}
                                {errorMsg && (
                                    <div className="shrink-0 p-3 bg-red-950/40 border border-red-900/60 rounded-2xl text-red-200 text-xs font-mono whitespace-pre-wrap overflow-y-auto max-h-[42dvh] md:max-h-[35dvh]">
                                        <div className="font-bold uppercase tracking-wider text-red-400 mb-1">Error:</div>
                                        {errorMsg}
                                    </div>
                                )}

                                {saveMsg && (
                                    <div className="shrink-0 p-3 bg-emerald-950/40 border border-emerald-900/60 rounded-2xl text-emerald-200 text-xs font-mono whitespace-pre-wrap overflow-y-auto max-h-[18dvh]">
                                        <div className="font-bold uppercase tracking-wider text-emerald-400 mb-1">Guardado:</div>
                                        {saveMsg}
                                    </div>
                                )}

                                {!hasOutput && (
                                    <div className="hidden lg:flex flex-1 min-h-0 rounded-2xl border border-dashed border-slate-800 bg-slate-950/30 items-center justify-center text-slate-700 text-sm text-center px-8"></div>
                                )}

                                {result && (
                                    <>
                                        {guide ? (
                                            <div className="shrink-0 grid grid-cols-2 gap-2" role="tablist" aria-label="Contenido generado">
                                                <button type="button" role="tab" aria-selected={!guideView} onClick={() => setGuideView(false)} className={`rounded-xl px-2 py-2.5 text-xs font-bold ${!guideView ? 'bg-cyan-700 text-white' : 'bg-slate-800 text-slate-300'}`}>Transcripción</button>
                                                <button type="button" role="tab" aria-selected={guideView} onClick={() => setGuideView(true)} className={`rounded-xl px-2 py-2.5 text-xs font-bold ${guideView ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-300'}`}>{guideType === 'catalogue' ? 'Programas del vídeo' : 'Guía paso a paso'}</button>
                                            </div>
                                        ) : <button type="button" onClick={createGuide} disabled={guideLoading || !canTranscribe} className="shrink-0 rounded-xl border border-amber-600 bg-amber-900/50 px-3 py-2.5 text-sm font-bold text-amber-100 hover:bg-amber-800/60 disabled:opacity-50">{guideLoading ? 'Creando guía…' : 'Crear guía paso a paso'}</button>}
                                        {guideError && <p className="shrink-0 text-xs text-red-300" role="alert">{guideError}</p>}
                                        {guideView && <p className="shrink-0 text-xs text-amber-300">{guideType === 'catalogue' ? 'Programas identificados en las imágenes. Comprueba sus páginas antes de instalarlos.' : 'Guía basada en la transcripción. Revisa los pasos antes de seguirlos.'}</p>}
                                        {!guideView && resultMeta?.mode === 'visual' && <p className="text-xs text-sky-300">Texto leído de las imágenes, en su idioma original. Las marcas de tiempo son aproximadas; revisa los fragmentos [ilegible].</p>}
                                        {!guideView && resultMeta?.mode !== 'visual' && resultMeta?.platform === 'YouTube' && <p className="text-xs text-sky-300">Si YouTube reproduce un doblaje automático, la transcripción se traduce al español desde el audio disponible y puede no coincidir palabra por palabra con ese doblaje.</p>}
                                        {!guideView && resultMeta?.mode !== 'visual' && !visualVerification && resultMeta?.sourceUrl && <p className="text-xs text-amber-300">Solo audio disponible: revisa los nombres de programas con el vídeo original.</p>}
                                        <div ref={contentRef} className="flex-1 min-h-0 bg-slate-950 p-3 md:p-4 rounded-2xl border border-slate-700 text-slate-100 text-sm whitespace-pre-wrap leading-relaxed overflow-y-auto shadow-inner" role="region" aria-label={guideView ? 'Guía paso a paso' : 'Texto transcrito'} tabIndex="0">
                                            {guideView ? renderGuideText(guide) : result}
                                        </div>

                                        <div className="shrink-0 grid grid-cols-2 gap-2 md:gap-3">
                                            <button onClick={downloadTextFile} className="bg-sky-800 hover:bg-sky-700 py-3 rounded-xl text-xs md:text-sm font-bold text-white border border-sky-600 transition-all">Descargar archivo</button>
                                            <button onClick={shareTranscript} className="bg-violet-800 hover:bg-violet-700 py-3 rounded-xl text-xs md:text-sm font-bold text-white border border-violet-600 transition-all">Compartir</button>
                                        </div>
                                    </>
                                )}
                            </section>
                        </main>

                        <footer className="shrink-0 border-t border-slate-800 px-4 py-2 text-center relative">
                            {installPrompt && <button onClick={installApp} className="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-semibold text-cyan-300 hover:text-cyan-200">Instalar app</button>}
                            <p className="text-[8px] text-slate-500 opacity-90 uppercase tracking-[0.35em]">Architected by GUSLIGHT</p>
                            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[7px] md:text-[8px] text-slate-400 opacity-90 tracking-[0.12em] pointer-events-none">Beta v1.2</span>
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
