<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETERNA | Digital Synthesis</title>
    <!-- PWA Meta Tags para que parezca app nativa al añadir a inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const apiKey = "AIzaSyBR0EUyWSPQ5yPqdwvUN2arNRlMUIfQa4c"; 
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";

        function App() {
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [mediaFile, setMediaFile] = useState(null);
            const [mediaBase64, setMediaBase64] = useState(null);
            const [videoPreviewUrl, setVideoPreviewUrl] = useState(null);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setMediaFile(file);
                if (videoPreviewUrl) URL.revokeObjectURL(videoPreviewUrl);
                setVideoPreviewUrl(URL.createObjectURL(file));
                const reader = new FileReader();
                reader.onload = (ev) => setMediaBase64(ev.target.result.split(',')[1]);
                reader.readAsDataURL(file);
            };

            const handleTranscribe = async () => {
                if (!mediaBase64) return;
                setLoading(true);
                setResult(null);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [
                                { text: "Transcribe el archivo adjunto. Solo devuelve el texto literal, sin frases introductorias." },
                                { inlineData: { mimeType: mediaFile.type, data: mediaBase64 } }
                            ]}]
                        })
                    });
                    const data = await response.json();
                    let rawText = data.candidates[0].content.parts[0].text;
                    setResult(rawText.replace(/^(Claro,|Aquí tienes|La transcripción|Hola|¡Hola!|Aquí está|Te dejo la|Transcripción:).*\n?/i, "").trim());
                } catch (e) {
                    setResult("Error al procesar el archivo.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen p-4 flex items-center justify-center">
                    <div className="max-w-md w-full bg-[#0d1521] border border-slate-800 rounded-3xl p-6 shadow-2xl">
                        <h1 className="text-4xl font-light text-white text-center mb-1 tracking-[0.2em] uppercase">AETERNA</h1>
                        <p className="text-[10px] text-slate-500 text-center mb-8 tracking-[0.4em] uppercase">Digital Synthesis</p>
                        
                        <div className="flex flex-col gap-4 mb-8">
                            <p className="text-[10px] text-cyan-400 font-bold uppercase tracking-widest text-center border-b border-slate-800 pb-2">Paso 1: Obtén el archivo</p>
                            <a href="https://snaptik.app/" target="_blank" className="w-full bg-[#00a86b] hover:bg-[#008f5a] text-white font-bold py-3.5 rounded-xl text-center text-sm transition-all">TikTok Downloader</a>
                            <a href="https://www.y2mate.is/" target="_blank" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl text-center text-sm transition-all">YouTube Downloader</a>
                        </div>

                        <div className="bg-slate-950 p-5 rounded-2xl border border-slate-700 text-center mb-6">
                            <p className="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-4">Paso 2: Selección</p>
                            <input type="file" accept="video/*,audio/*" onChange={handleFileChange} className="block w-full text-sm text-slate-300 file:mr-4 file:py-2.5 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950" />
                        </div>

                        {videoPreviewUrl && <video src={videoPreviewUrl} controls className="w-full mb-6 rounded-2xl" />}

                        <button onClick={handleTranscribe} disabled={loading} className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl mb-8">
                            {loading ? "Sintetizando..." : "Iniciar Conversión"}
                        </button>

                        {result && (
                            <div className="space-y-4">
                                <div className="bg-slate-950 p-5 rounded-2xl border border-slate-700 text-sm max-h-60 overflow-y-auto">{result}</div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => navigator.clipboard.writeText(result)} className="bg-slate-800 py-3 rounded-xl text-xs font-bold">Copiar</button>
                                    <button onClick={() => { const blob = new Blob([result], {type:'text/plain'}); const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='transcripcion.txt'; a.click(); }} className="bg-slate-800 py-3 rounded-xl text-xs font-bold">Descargar</button>
                                </div>
                            </div>
                        )}
                        <p className="mt-10 text-[9px] text-slate-600 uppercase text-center tracking-widest">Architected by GUSLIGHT</p>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
